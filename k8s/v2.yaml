
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lms-v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lms-v2
  template:
    metadata:
      labels:
        app: lms-v2
    spec:
      containers:
        - name: lms
          image: oliveprishita/lms:v2
          ports:
            - containerPort: 5000
          env:
            - name: APP_VERSION
              value: "v2"
            - name: LMS_DATA_DIR
              value: /data
          volumeMounts:
            - name: notes-storage
              mountPath: /data
      volumes:
        - name: notes-storage
          persistentVolumeClaim:
            claimName: lms-data
---
apiVersion: v1
kind: Service
metadata:
  name: lms-v2-service
spec:
  type: NodePort
  selector:
    app: lms-v2
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30082
