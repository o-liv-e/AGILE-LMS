
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lms-v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lms-v1
  template:
    metadata:
      labels:
        app: lms-v1
    spec:
      containers:
        - name: lms
          image: oliveprishita/lms:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          env:
            - name: APP_VERSION
              value: "v1"
          volumeMounts:
            - name: notes
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: notes
          persistentVolumeClaim:
            claimName: lms-data
---
apiVersion: v1
kind: Service
metadata:
  name: lms-v1-service
spec:
  type: ClusterIP
  selector:
    app: lms-v1
  ports:
    - port: 80
      targetPort: 5000
